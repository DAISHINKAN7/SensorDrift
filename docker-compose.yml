services:
  # PostgreSQL Database (OLTP + TimescaleDB for time-series)
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: sensordrift_postgres
    environment:
      POSTGRES_USER: sensordrift
      POSTGRES_PASSWORD: sensordrift_password
      POSTGRES_DB: gas_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_scripts:/docker-entrypoint-initdb.d
    networks:
      - sensordrift_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensordrift"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Caching & Real-time metrics)
  redis:
    image: redis:7-alpine
    container_name: sensordrift_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sensordrift_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO (S3-compatible Data Lake)
  minio:
    image: minio/minio:latest
    container_name: sensordrift_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - sensordrift_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Kafka (Real-time Streaming)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: sensordrift_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sensordrift_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sensordrift_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - sensordrift_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Apache Airflow - PostgreSQL
  airflow-postgres:
    image: postgres:13
    container_name: sensordrift_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - sensordrift_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Airflow - Webserver
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sensordrift_airflow_webserver
    depends_on:
      - airflow-postgres
      - redis
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'sensordrift_secret_key_change_in_production'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./model:/opt/airflow/model
      - .:/opt/airflow/project
    ports:
      - "8081:8080"
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
               airflow webserver"
    networks:
      - sensordrift_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Apache Airflow - Scheduler
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sensordrift_airflow_scheduler
    depends_on:
      - airflow-postgres
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./model:/opt/airflow/model
      - .:/opt/airflow/project
    command: airflow scheduler
    networks:
      - sensordrift_network

  # Grafana (Real-time Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: sensordrift_grafana
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - sensordrift_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Metabase (Business Analytics)
  metabase:
    image: metabase/metabase:latest
    container_name: sensordrift_metabase
    depends_on:
      - postgres
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: sensordrift
      MB_DB_PASS: sensordrift_password
      MB_DB_HOST: postgres
    ports:
      - "3001:3000"
    volumes:
      - metabase_data:/metabase-data
    networks:
      - sensordrift_network

  # Flask Application
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: sensordrift_flask
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sensordrift
      POSTGRES_PASSWORD: sensordrift_password
      POSTGRES_DB: gas_monitoring
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLASK_ENV: production
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - ./model:/app/model
      - ./data:/app/data
    networks:
      - sensordrift_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Jupyter Lab (EDA & Analysis)
  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: sensordrift_jupyter
    depends_on:
      - postgres
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      GRANT_SUDO: "yes"
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
      - ./model:/home/jovyan/model
    networks:
      - sensordrift_network
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''

volumes:
  postgres_data:
  redis_data:
  minio_data:
  airflow_postgres_data:
  grafana_data:
  metabase_data:

networks:
  sensordrift_network:
    driver: bridge
