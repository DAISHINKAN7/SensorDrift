apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: gas_monitoring
    user: sensordrift
    secureJsonData:
      password: 'sensordrift_password'
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1400
      timescaledb: true
    isDefault: true
    editable: true

  - name: PostgreSQL (Read-Only)
    type: postgres
    access: proxy
    url: postgres:5432
    database: gas_monitoring
    user: analytics_readonly
    secureJsonData:
      password: 'analytics_readonly'
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1400
      timescaledb: true
    editable: false
